  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const scrollbarStyle = '<style>* { scrollbar-width: none !important; -ms-overflow-style: none !important; } *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }</style>';
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + scrollbarStyle + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    const postSwapStyle = document.createElement('style');
    postSwapStyle.textContent = '* { scrollbar-width: none !important; -ms-overflow-style: none !important; } *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }';
    (document.head || document.documentElement).appendChild(postSwapStyle);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-6px)}\n}\n@keyframes sw0 {\n  from{opacity:0;transform:translateY(12px)}\n  to{opacity:1;transform:none}\n}\n@keyframes sw1 {\n  from{opacity:0;transform:translateY(12px)}\n  to{opacity:1;transform:none}\n}\n@keyframes wander {\n  0%{left:18%;top:32%}\n  20%{left:42%;top:58%}\n  40%{left:64%;top:26%}\n  60%{left:80%;top:60%}\n  80%{left:36%;top:76%}\n  100%{left:18%;top:32%}\n}\n@keyframes typing {\n  0%{width:0}\n  30%{width:250px}\n  86%{width:250px}\n  100%{width:0}\n}\n@keyframes arrive {\n  0%,32%{opacity:0;transform:translateY(12px)}\n  42%,88%{opacity:1;transform:none}\n  97%,100%{opacity:0;transform:translateY(-4px)}\n}\n@keyframes ring {\n  0%{box-shadow:0 0 0 0 rgba(47,59,255,.4)}\n  70%,100%{box-shadow:0 0 0 9px rgba(47,59,255,0)}\n}\n@keyframes cy {\n  0%,26%{box-shadow:0 0 0 2px #14150F}\n  34%,100%{box-shadow:0 0 0 0 rgba(20,21,15,0)}\n}\n\n@supports (animation-timeline: view()) {\n  .rv{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 60%}\n}\n@supports (animation-timeline: scroll()) {\n  .sp{animation:grow linear both;animation-timeline:scroll(root)}\n}\n@media (max-width:900px) {\n  .cmd{display:none}\n  .cursor{display:none}\n}\n@media (max-width:820px) {\n  .side{flex-basis:100%;border-right:0;border-bottom:1px solid #E4E4DB}\n}\n@media (prefers-reduced-motion:reduce) {\n  *,*::before,*::after{animation:none!important;transition:none!important}\n  .hl{background-size:100% .17em!important}\n  .tw{width:auto!important}\n  .cursor{display:none}\n}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"top\" style=\"background:#F4F4F0;color:#14150F;font-family:'Geist',system-ui,sans-serif;width:100%;overflow-x:clip\" data-canvas-width=\"1360\" data-canvas-height=\"5200\" data-document-role=\"page\" data-label=\"Landing page\">\n  <div class=\"sp\" aria-hidden=\"true\"><\u002Fdiv>\n\n  <!-- NAV -->\n  <header style=\"position:relative;z-index:5\">\n    <div class=\"wrap\" style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:18px;padding-bottom:18px\">\n      <a href=\"#top\" aria-label=\"Solorise home\" style=\"display:inline-flex;align-items:center;gap:10px\">\n        <svg width=\"30\" height=\"30\" sc-camel-view-box=\"0 0 30 30\" aria-hidden=\"true\"><rect width=\"30\" height=\"30\" rx=\"8\" fill=\"#14150F\"><\u002Frect><rect x=\"7\" y=\"8\" width=\"7\" height=\"14\" rx=\"2\" fill=\"#F4F4F0\"><\u002Frect><rect x=\"16\" y=\"8\" width=\"7\" height=\"8\" rx=\"2\" fill=\"#8E96FF\"><\u002Frect><\u002Fsvg>\n        <span class=\"disp\" style=\"font-weight:700;font-size:23px\">Solorise<\u002Fspan>\n      <\u002Fa>\n      <nav aria-label=\"Primary\" style=\"display:flex;align-items:center;gap:4px;flex-wrap:wrap\">\n        <a class=\"nl\" href=\"#board\">Board<\u002Fa>\n        <a class=\"nl\" href=\"#how\">How it fits<\u002Fa>\n        <a class=\"nl\" href=\"#ai\">AI triage<\u002Fa>\n        <a class=\"nl\" href=\"#access\">Access<\u002Fa>\n        <a class=\"btn btn-line btn-sm\" href=\"#join\" style=\"margin-left:6px\">Sign in<\u002Fa>\n        <a class=\"btn btn-pri btn-sm\" href=\"#join\">Get early access<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- HERO -->\n  <section style=\"position:relative\">\n    <div class=\"gridbg\" aria-hidden=\"true\"><\u002Fdiv>\n    <div class=\"wrap\" style=\"position:relative;padding-top:clamp(28px,6vw,76px);padding-bottom:clamp(40px,6vw,72px)\">\n      <div class=\"in mono\" style=\"animation-delay:.05s;display:inline-flex;align-items:center;gap:10px;padding:7px 14px 7px 12px;border:1px solid #D4D4CA;border-radius:999px;background:#fff;font-size:12px;font-weight:500;color:#3A3D34\">\n        <span class=\"pulse\"><\u002Fspan>\n        Tickets for freelancers &amp; one-person studios\n      <\u002Fdiv>\n      <h1 class=\"disp\" style=\"margin:22px 0 0;font-size:clamp(42px,7.6vw,100px);line-height:.96;font-weight:700;max-width:13em\"><span class=\"wd\" style=\"animation-delay:.1 mono crumb\">solorise.app / <span style=\"color:#14150F;font-weight:500\">{{slug}}<\u002Fspan> / board<\u002Fspan>\n              <span class=\"live\"><span class=\"ld\"><\u002Fspan>{{liveLabel}}<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"cmd\" aria-hidden=\"true\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\"><circle cx=\"7\" cy=\"7\" r=\"4.5\"><\u002Fcircle><path d=\"M10.5 10.5 14 14\"><\u002Fpath><\u002Fsvg>\n              Search, or ask AI\n              <kbd>⌘K<\u002Fkbd>\n            <\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n              <div class=\"pres\" aria-hidden=\"true\"><span class=\"av av-YO on\">YO<\u002Fspan><span class=\"av av-MR on\">MR<\u002Fspan><span class=\"av av-TB\">TB<\u002Fspan><\u002Fdiv>\n              <span class=\"lbl\">View as<\u002Fspan>\n              <div class=\"segs\" role=\"group\" aria-label=\"View the board as\">\n                <sc-for list=\"{{roles}}\" as=\"r\" hint-placeholder-count=\"3\">\n                  <button class=\"{{r.cls}}\" aria-pressed=\"{{r.pressed}}\" sc-camel-on-click=\"{{r.pick}}\">{{r.label}}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex;flex-wrap:wrap;align-items:stretch\">\n            <aside class=\"side\" aria-label=\"Projects and people\">\n              <span class=\"lbl\" style=\"padding:2px 4px 6px\">Projects<\u002Fspan>\n              <sc-for list=\"{{projList}}\" as=\"p\" hint-placeholder-count=\"3\">\n                <button class=\"{{p.cls}}\" sc-camel-on-click=\"{{p.pick}}\">\n                  <span class=\"{{p.dotCls}}\"><\u002Fspan>\n                  <span style=\"display:flex;flex-direction:column;min-width:0;flex:1\">\n                    <span style=\"font-size:14px;font-weight:600\">{{p.name}}<\u002Fspan>\n                    <span style=\"font-size:12px;color:#6A6D62\">{{p.sub}}<\u002Fspan>\n                    <progress class=\"prog mp\" value=\"{{p.pct}}\" max=\"100\" aria-hidden=\"true\"><\u002Fprogress>\n                  <\u002Fspan>\n                  <sc-if value=\"{{p.locked}}\" hint-placeholder-val=\"{{false}}\">\n                    <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#6A6D62\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" role=\"img\" aria-label=\"No access\"><rect x=\"3\" y=\"7\" width=\"10\" height=\"7\" rx=\"2\"><\u002Frect><path d=\"M5.5 7V5a2.5 2.5 0 0 1 5 0v2\"><\u002Fpath><\u002Fsvg>\n                  <\u002Fsc-if>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n              <p style=\"margin:8px 4px 14px;font-size:12px;line-height:1.45;color:#6A6D62\">Each project has its own board, people and permissions.<\u002Fp>\n              <span class=\"lbl\" style=\"padding:2px 4px 6px\">On this project<\u002Fspan>\n              <div style=\"display:flex;flex-direction:column;gap:10px;padding:0 4px\">\n                <sc-for list=\"{{members}}\" as=\"m\" hint-placeholder-count=\"4\">\n                  <div style=\"display:flex;align-items:center;gap:10px\">\n                    <span class=\"{{m.avCls}}\">{{m.ini}}<\u002Fspan>\n                    <span style=\"display:flex;flex-direction:column\">\n                      <span style=\"font-size:13px;font-weight:500\">{{m.name}}<\u002Fspan>\n                      <span style=\"font-size:12px;color:#6A6D62\">{{m.role}}<\u002Fspan>\n                    <\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Faside>\n\n            <div class=\"relcol\" style=\"flex:1 1 560px;min-width:0;display:flex;flex-direction:column\">\n              <sc-if value=\"{{hasToast}}\" hint-placeholder-val=\"{{false}}\">\n                <div class=\"{{toastCls}}\" role=\"status\">\n                  <span class=\"{{toastAv}}\">{{toastIni}}<\u002Fspan>\n                  <span>{{toastText}}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px 20px 4px\">\n                <div>\n                  <h2 class=\"disp\" style=\"margin:0;font-size:28px;font-weight:700;line-height:1.05\">{{title}}<\u002Fh2>\n                  <div style=\"font-size:13px;color:#6A6D62;margin-top:4px\">{{sub}}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;align-items:center;gap:14px;flex-wrap:wrap\">\n                  <div style=\"display:flex;align-items:center;gap:10px\">\n                    <progress class=\"prog\" value=\"{{pct}}\" max=\"100\" aria-label=\"Share of tickets shipped\"><\u002Fprogress>\n                    <span class=\"mono\" style=\"font-size:12px;color:#3A3D34\">{{pct}}% shipped<\u002Fspan>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{showReport}}\" hint-placeholder-val=\"{{false}}\">\n                    <button class=\"btn btn-pri btn-sm\" sc-camel-on-click=\"{{reportBug}}\">\n                      <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M8 3v10M3 8h10\"><\u002Fpath><\u002Fsvg>\n                      Report a bug\n                    <\u002Fbutton>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 20px 0\">\n                <div role=\"group\" aria-label=\"Filter tickets\" style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                  <sc-for list=\"{{filters}}\" as=\"f\" hint-placeholder-count=\"4\">\n                    <button class=\"{{f.cls}}\" aria-pressed=\"{{f.pressed}}\" sc-camel-on-click=\"{{f.pick}}\">{{f.label}}<span class=\"fc\">{{f.count}}<\u002Fspan><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div class=\"mono\" style=\"font-size:12px;color:#6A6D62\">{{hint}}<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"margin:12px 20px 0;padding:9px 14px;border-radius:10px;background:#ECEDFF;border:1px solid #D2D5FF;color:#1B2194;font-size:13px;line-height:1.45\">{{roleNote}}<\u002Fdiv>\n\n              <sc-if value=\"{{locked}}\" hint-placeholder-val=\"{{false}}\">\n                <div class=\"pop\" style=\"margin:16px 20px 22px;padding:clamp(28px,5vw,56px) 20px;border:1.5px dashed #CFCFC4;border-radius:16px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px\">\n                  <svg width=\"28\" height=\"28\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"#14150F\" stroke-width=\"1.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"7\" width=\"10\" height=\"7\" rx=\"2\"><\u002Frect><path d=\"M5.5 7V5a2.5 2.5 0 0 1 5 0v2\"><\u002Fpath><\u002Fsvg>\n                  <div class=\"disp\" style=\"font-size:22px;font-weight:700\">{{lockTitle}}<\u002Fdiv>\n                  <div style=\"font-size:14px;color:#5B5E54;max-width:380px\">{{lockBody}}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{open}}\" hint-placeholder-val=\"{{true}}\">\n                <div style=\"position:relative\">\n                  <div class=\"cursor\" aria-hidden=\"true\">\n                    <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 18 18\"><path d=\"M2 1.5 15 8l-5.6 1.7L7.4 15.5z\" fill=\"#5B50F5\" stroke=\"#fff\" stroke-width=\"1.2\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                    <span>Maya<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"overflow-x:auto;padding:14px 20px 22px\">\n                    <div class=\"{{swapCls}}\" style=\"display:flex;gap:12px;min-width:1000px;align-items:stretch\">\n                      <sc-for list=\"{{cols}}\" as=\"c\" hint-placeholder-count=\"4\">\n                        <div class=\"{{c.cls}}\" sc-camel-on-drag-over=\"{{c.over}}\" sc-camel-on-drop=\"{{c.drop}}\">\n                          <div class=\"colh\"><span class=\"{{c.dotCls}}\"><\u002Fspan><span>{{c.name}}<\u002Fspan><span class=\"cnt\">{{c.count}}<\u002Fspan><\u002Fdiv>\n                          <sc-for list=\"{{c.items}}\" as=\"t\" hint-placeholder-count=\"2\">\n                            <article class=\"{{t.cls}}\" draggable=\"{{t.canDrag}}\" sc-camel-on-drag-start=\"{{t.dragStart}}\" sc-camel-on-drag-end=\"{{onDragEnd}}\">\n                              <div class=\"trow\">\n                                <span class=\"{{t.tiCls}}\">\n                                  <sc-if value=\"{{t.isBug}}\" hint-placeholder-val=\"{{false}}\"><svg sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"5\" y=\"5\" width=\"6\" height=\"8\" rx=\"3\"><\u002Frect><path d=\"M8 5V3M5 8H2.5M11 8h2.5M5.5 11 3.5 12.5M10.5 11l2 1.5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                                  <sc-if value=\"{{t.isFeat}}\" hint-placeholder-val=\"{{false}}\"><svg sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M8 2l1.5 4.5L14 8l-4.5 1.5L8 14l-1.5-4.5L2 8l4.5-1.5z\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                                  <sc-if value=\"{{t.isChg}}\" hint-placeholder-val=\"{{false}}\"><svg sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 5h9M9 2l3 3-3 3M13 11H4M7 8l-3 3 3 3\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                                <\u002Fspan>\n                                <span class=\"sr\">{{t.typeLabel}}<\u002Fspan>\n                                <span class=\"tid\">{{t.id}}<\u002Fspan>\n                                <sc-if value=\"{{t.hasVia}}\" hint-placeholder-val=\"{{false}}\"><span class=\"via\">via {{t.via}}<\u002Fspan><\u002Fsc-if>\n                                <sc-if value=\"{{t.canMove}}\" hint-placeholder-val=\"{{true}}\">\n                                  <button class=\"adv\" aria-label=\"Move {{t.id}} to the next column\" sc-camel-on-click=\"{{t.move}}\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 8h10M9 4l4 4-4 4\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n                                <\u002Fsc-if>\n                              <\u002Fdiv>\n                              <h4 class=\"ttl\">{{t.title}}<\u002Fh4>\n                              <div class=\"mrow\">\n                                <span class=\"dept\">{{t.dept}}<\u002Fspan>\n                                <span class=\"{{t.priCls}}\" role=\"img\" aria-label=\"Priority {{t.priLabel}}\"><i><\u002Fi><i><\u002Fi><i><\u002Fi><\u002Fspan>\n                                <sc-if value=\"{{t.hasCm}}\" hint-placeholder-val=\"{{false}}\"><span class=\"meta\"><svg sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z\"><\u002Fpath><\u002Fsvg>{{t.cm}}<\u002Fspan><\u002Fsc-if>\n                                <sc-if value=\"{{t.hasDue}}\" hint-placeholder-val=\"{{false}}\"><span class=\"meta\"><svg sc-camel-view-box=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"8\" cy=\"8\" r=\"5.5\"><\u002Fcircle><path d=\"M8 5v3l2 1.5\"><\u002Fpath><\u002Fsvg>{{t.due}}<\u002Fspan><\u002Fsc-if>\n                                <span class=\"{{t.avCls}}\" style=\"margin-left:auto\">{{t.ini}}<\u002Fspan>\n                              <\u002Fdiv>\n                            <\u002Farticle>\n                          <\u002Fsc-for>\n                          <sc-if value=\"{{c.empty}}\" hint-placeholder-val=\"{{false}}\">\n                            <div class=\"emptycol\">Drop a ticket here<\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p class=\"mono in\" style=\"animation-delay:1.4s;margin:18px 0 0;text-align:center;font-size:12px;color:#5B5E54\">Live demo: drag a card, switch who you're viewing as, or report a bug as the client.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SHIFT STATEMENT -->\n  <section class=\"wrap rv\" style=\"padding-top:clamp(40px,7vw,96px);padding-bottom:clamp(40px,7vw,96px)\">\n    <p class=\"disp\" style=\"margin:0;max-width:1020px;font-size:clamp(28px,4.7vw,58px);line-height:1.08;font-weight:600\">Every project has a different crew. <span style=\"color:#2F3BFF\">Keep the work in one place<\u002Fspan>.<\u002Fp>\n    <p style=\"margin:24px 0 0;max-width:560px;font-size:18px;line-height:1.55;color:#4A4D44\">Create a board for each client, invite only the people involved, and turn every request into an assigned ticket. Contractors know what to do, clients can follow progress, and nothing gets lost in chat.<\u002Fp>\n  <\u002Fsection>\n\n  <!-- HOW IT FITS -->\n  <section id=\"how\" class=\"wrap\" style=\"padding-bottom:clamp(56px,8vw,112px)\">\n    <div class=\"rv\">\n      <div class=\"lbl\" style=\"color:#2F3BFF\">How it fits together<\u002Fdiv>\n      <h2 class=\"disp\" style=\"margin:12px 0 0;font-size:clamp(32px,5vw,60px);line-height:1.02;font-weight:700;max-width:14em\">Built around how freelance work actually flows.<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-wrap:wrap;gap:16px;margin-top:40px\">\n      <div class=\"bc rv\" style=\"flex:2 1 520px\">\n        <div aria-hidden=\"true\" style=\"display:flex;flex-direction:column;gap:10px\">\n          <div style=\"display:flex;align-items:center;gap:12px\"><span class=\"mono\" style=\"width:56px;font-size:11px;color:#6A6D62\">Harbor<\u002Fspan><div class=\"mb\"><span class=\"mc\"><\u002Fspan><span class=\"mc\"><\u002Fspan><span class=\"mc\"><\u002Fspan><span class=\"hop\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px\"><span class=\"mono\" style=\"width:56px;font-size:11px;color:#6A6D62\">Nomad<\u002Fspan><div class=\"mb\"><span class=\"mc\"><\u002Fspan><span class=\"mc\"><\u002Fspan><span class=\"mc\"><\u002Fspan><span class=\"hop hop2\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:12px\"><span class=\"mono\" style=\"width:56px;font-size:11px;color:#6A6D62\">Kiln<\u002Fspan><div class=\"mb\"><span class=\"mc\"><\u002Fspan><span class=\"mc\"><\u002Fspan><span class=\"mc\"><\u002Fspan><span class=\"hop hop3\"><\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h3 class=\"disp\" style=\"margin:0;font-size:28px;line-height:1.1;font-weight:700\">One project. One board.<\u002Fh3>\n          <p style=\"margin:10px 0 0;font-size:16px;line-height:1.55;color:#4A4D44;max-width:480px\">Every client gets their own project with its own columns, tickets and people. Switch between them in a click, and nothing leaks from one to the next.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"bc rv\" style=\"flex:1 1 320px\">\n        <div aria-hidden=\"true\" style=\"display:flex;flex-direction:column;gap:10px;min-height:128px\">\n          <div class=\"fk\"><span class=\"mono\" style=\"font-size:11px;color:#6A6D62\">LENA · CLIENT<\u002Fspan><span class=\"twrap\"><span class=\"tw\">Menu overlaps the logo on iPad<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <div class=\"fk arrive\" style=\"border-color:#2F3BFF;flex-direction:row;align-items:center;gap:10px\"><span class=\"tag tag-bug\">Bug<\u002Fspan><span style=\"font-size:13px\">Filed to Inbox · HB-22<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h3 class=\"disp\" style=\"margin:0;font-size:28px;line-height:1.1;font-weight:700\">Clients who help, not chase.<\u002Fh3>\n          <p style=\"margin:10px 0 0;font-size:16px;line-height:1.55;color:#4A4D44\">Invite a client to watch progress and report bugs straight into your Inbox. No screenshots lost in chat threads.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"bc rv\" style=\"flex:1 1 320px\">\n        <div aria-hidden=\"true\" style=\"display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:flex;align-items:center;gap:10px\"><span class=\"av av32 av-MR ringav\">MR<\u002Fspan><span style=\"font-size:14px;font-weight:500\">Maya R.<\u002Fspan><span class=\"dept\" style=\"margin-left:auto\">Frontend<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\"><span class=\"av av32 av-TB ringav\" style=\"animation-delay:1s\">TB<\u002Fspan><span style=\"font-size:14px;font-weight:500\">Tomas B.<\u002Fspan><span class=\"dept\" style=\"margin-left:auto\">Backend<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px\"><span class=\"av av32 av-IK ringav\" style=\"animation-delay:2s\">IK<\u002Fspan><span style=\"font-size:14px;font-weight:500\">Ines K.<\u002Fspan><span class=\"dept\" style=\"margin-left:auto\">Design<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h3 class=\"disp\" style=\"margin:0;font-size:28px;line-height:1.1;font-weight:700\">Outside hands, scoped.<\u002Fh3>\n          <p style=\"margin:10px 0 0;font-size:16px;line-height:1.55;color:#4A4D44\">Add contractors per project and per department. They see the tickets they need, not your whole business.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"bc rv\" style=\"flex:2 1 520px\">\n        <div aria-hidden=\"true\" style=\"display:flex;flex-direction:column;gap:12px;padding:3px\">\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px\"><span class=\"tag tag-bug cy\">Bug<\u002Fspan><span class=\"tag tag-feature cy\" style=\"animation-delay:1.5s\">Feature<\u002Fspan><span class=\"tag tag-change cy\" style=\"animation-delay:3s\">Change request<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px\"><span class=\"dept\">Frontend<\u002Fspan><span class=\"dept\">Backend<\u002Fspan><span class=\"dept\">Design<\u002Fspan><span class=\"dept\">Content<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <h3 class=\"disp\" style=\"margin:0;font-size:28px;line-height:1.1;font-weight:700\">Scope creep gets a paper trail.<\u002Fh3>\n          <p style=\"margin:10px 0 0;font-size:16px;line-height:1.55;color:#4A4D44;max-width:520px\">Every ticket is a bug, a feature or a change request, tagged to a department. When a client asks for \"one small thing\", you can see exactly what kind of thing it is.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- AI TRIAGE -->\n  <section id=\"ai\" style=\"background:#14150F;color:#F4F4F0\">\n    <div class=\"wrap\" style=\"padding-top:clamp(56px,8vw,112px);padding-bottom:clamp(56px,8vw,112px);display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,64px);align-items:flex-start\">\n      <div class=\"rv\" style=\"flex:1 1 380px;min-width:0\">\n        <div class=\"lbl\" style=\"color:#9AA1FF\">AI triage<\u002Fdiv>\n        <h2 class=\"disp\" style=\"margin:12px 0 0;font-size:clamp(32px,5vw,60px);line-height:1.02;font-weight:700\">Type the problem. Skip the paperwork.<\u002Fh2>\n        <p style=\"margin:22px 0 0;font-size:18px;line-height:1.55;color:#B8BBAF;max-width:480px\">Describe an issue the way you'd text it. Solorise files it, tags it and suggests who should pick it up, based on skills and who's already busy.<\u002Fp>\n        <div style=\"margin-top:32px;display:flex;flex-direction:column\">\n          <div style=\"display:flex;gap:16px;padding:16px 0;border-top:1px solid #34362C\"><span class=\"mono\" style=\"color:#9AA1FF;font-size:13px\">01<\u002Fspan><div><div style=\"font-weight:600\">Classify<\u002Fdiv><div style=\"color:#B8BBAF;font-size:15px;margin-top:2px\">Bug, feature or change request, read from your own words.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;padding:16px 0;border-top:1px solid #34362C\"><span class=\"mono\" style=\"color:#9AA1FF;font-size:13px\">02<\u002Fspan><div><div style=\"font-weight:600\">Route<\u002Fdiv><div style=\"color:#B8BBAF;font-size:15px;margin-top:2px\">Sent to the right project and tagged Frontend, Backend, Design or Content.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:16px;padding:16px 0;border-top:1px solid #34362C;border-bottom:1px solid #34362C\"><span class=\"mono\" style=\"color:#9AA1FF;font-size:13px\">03<\u002Fspan><div><div style=\"font-weight:600\">Assign<\u002Fdiv><div style=\"color:#B8BBAF;font-size:15px;margin-top:2px\">Suggests whoever covers it with the lightest queue. You can always override.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"rv\" style=\"flex:1 1 440px;min-width:0;background:#fff;color:#14150F;border-radius:22px;padding:clamp(18px,3vw,28px);box-shadow:0 30px 60px -24px rgba(0,0,0,.6)\">\n        <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:12px\">\n          <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 16 16\" fill=\"#2F3BFF\" aria-hidden=\"true\"><path d=\"M8 1l1.6 4.4L14 7l-4.4 1.6L8 13l-1.6-4.4L2 7l4.4-1.6z\"><\u002Fpath><\u002Fsvg>\n          <span style=\"font-weight:600;font-size:15px\">New ticket<\u002Fspan>\n        <\u002Fdiv>\n        <label for=\"issue\" class=\"sr\">Describe the issue<\u002Flabel>\n        <textarea id=\"issue\" class=\"ta\" rows=\"3\" placeholder=\"e.g. The checkout button overlaps the footer on iPhone SE, and the client can't pay\" value=\"{{aiText}}\" sc-camel-on-change=\"{{onText}}\" sc-camel-on-focus=\"{{onFocus}}\"><\u002Ftextarea>\n        <div style=\"display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px\">\n          <span class=\"lbl\" style=\"margin-right:2px\">Try<\u002Fspan>\n          <sc-for list=\"{{samples}}\" as=\"s\" hint-placeholder-count=\"3\">\n            <button class=\"cb\" sc-camel-on-click=\"{{s.pick}}\">{{s.label}}<\u002Fbutton>\n          <\u002Fsc-for>\n          <button class=\"btn btn-pri btn-sm\" style=\"margin-left:auto\" sc-camel-on-click=\"{{onTriage}}\">\n            <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 16 16\" fill=\"currentColor\" aria-hidden=\"true\"><path d=\"M8 1l1.6 4.4L14 7l-4.4 1.6L8 13l-1.6-4.4L2 7l4.4-1.6z\"><\u002Fpath><\u002Fsvg>\n            Triage\n          <\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"margin-top:18px;min-height:250px\">\n          <sc-if value=\"{{idle}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"padding:34px 18px;border:1.5px dashed #D4D4CA;border-radius:14px;text-align:center;font-size:14px;color:#6A6D62\">The triaged ticket shows up here.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{thinking}}\" hint-placeholder-val=\"{{false}}\">\n            <div style=\"padding:34px 18px;border:1.5px dashed #D4D4CA;border-radius:14px;text-align:center;font-size:14px;color:#4A4D44;display:flex;align-items:center;justify-content:center;gap:10px\">\n              <span style=\"display:inline-flex;gap:4px\" aria-hidden=\"true\"><span class=\"dotx\"><\u002Fspan><span class=\"dotx\"><\u002Fspan><span class=\"dotx\"><\u002Fspan><\u002Fspan>\n              Reading the issue\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{done}}\" hint-placeholder-val=\"{{false}}\">\n            <div>\n              <div class=\"rrow pop\" style=\"animation-delay:0s;border-top:0\"><span class=\"lbl\">Type<\u002Fspan><span class=\"{{res.tagCls}}\">{{res.typeLabel}}<\u002Fspan><\u002Fdiv>\n              <div class=\"rrow pop\" style=\"animation-delay:.1s\"><span class=\"lbl\">Department<\u002Fspan><span class=\"dept\">{{res.dept}}<\u002Fspan><\u002Fdiv>\n              <div class=\"rrow pop\" style=\"animation-delay:.2s\"><span class=\"lbl\">Project<\u002Fspan><span style=\"font-size:14px;font-weight:600\">{{res.projectName}}<\u002Fspan><\u002Fdiv>\n              <div class=\"rrow pop\" style=\"animation-delay:.3s\">\n                <span class=\"lbl\">Assign to<\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:10px;text-align:right\">\n                  <span style=\"display:flex;flex-direction:column;align-items:flex-end\">\n                    <span style=\"font-size:14px;font-weight:600\">{{res.whoName}}<\u002Fspan>\n                    <span style=\"font-size:12px;color:#6A6D62\">{{res.reason}}<\u002Fspan>\n                  <\u002Fspan>\n                  <span class=\"{{res.avCls}}\">{{res.whoIni}}<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fdiv>\n              <div class=\"rrow pop\" style=\"animation-delay:.4s\"><span class=\"lbl\">Priority<\u002Fspan><span class=\"{{res.prioCls}}\">{{res.priority}}<\u002Fspan><\u002Fdiv>\n              <div class=\"pop\" style=\"animation-delay:.5s;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid #ECECE5\">\n                <sc-if value=\"{{notCreated}}\" hint-placeholder-val=\"{{true}}\">\n                  <span style=\"font-size:13px;color:#6A6D62\">Lands in the Inbox column.<\u002Fspan>\n                  <button class=\"btn btn-ink btn-sm\" sc-camel-on-click=\"{{createTicket}}\">Create ticket<\u002Fbutton>\n                <\u002Fsc-if>\n                <sc-if value=\"{{created}}\" hint-placeholder-val=\"{{false}}\">\n                  <span style=\"font-size:14px;font-weight:600;color:#11602F\">Ticket created in {{res.projectName}}.<\u002Fspan>\n                  <a class=\"btn btn-line btn-sm\" href=\"#board\">See it on the board<\u002Fa>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ACCESS -->\n  <section id=\"access\" class=\"wrap\" style=\"padding-top:clamp(56px,8vw,112px);padding-bottom:clamp(56px,8vw,112px);display:flex;flex-wrap:wrap;gap:clamp(28px,5vw,64px);align-items:flex-start\">\n    <div class=\"rv\" style=\"flex:1 1 340px;min-width:0\">\n      <div class=\"lbl\" style=\"color:#2F3BFF\">Roles &amp; access<\u002Fdiv>\n      <h2 class=\"disp\" style=\"margin:12px 0 0;font-size:clamp(32px,5vw,60px);line-height:1.02;font-weight:700\">Everyone sees exactly what they should.<\u002Fh2>\n      <p style=\"margin:22px 0 0;font-size:18px;line-height:1.55;color:#4A4D44;max-width:440px\">Permissions follow the project, not the person. Add a client to one project and a contractor to two, and each of them gets a different board. Flip the \"View as\" switch on the board above to see it.<\u002Fp>\n    <\u002Fdiv>\n    <div class=\"rv\" style=\"flex:1.4 1 480px;min-width:0;background:#fff;border:1px solid #E1E1D8;border-radius:22px;overflow-x:auto\">\n      <sc-raw-table class=\"mt\">\n        <sc-raw-thead>\n          <sc-raw-tr><sc-raw-th scope=\"col\"><\u002Fsc-raw-th><sc-raw-th scope=\"col\">You (owner)<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Contractor<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Client<\u002Fsc-raw-th><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-thead>\n        <sc-raw-tbody>\n          <sc-raw-tr><sc-raw-th scope=\"row\" style=\"font-weight:500;font-size:15px;text-transform:none;letter-spacing:0;font-family:'Geist',sans-serif;color:#14150F;border-bottom:0\">Projects they can open<\u002Fsc-raw-th><sc-raw-td><span class=\"chip y\">All<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"chip p\">Invited only<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"chip p\">Their own<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-th scope=\"row\" style=\"font-weight:500;font-size:15px;text-transform:none;letter-spacing:0;font-family:'Geist',sans-serif;color:#14150F;border-bottom:0\">What they see on the board<\u002Fsc-raw-th><sc-raw-td><span class=\"chip y\">Everything<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"chip p\">Own department<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"chip p\">Client-visible<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-th scope=\"row\" style=\"font-weight:500;font-size:15px;text-transform:none;letter-spacing:0;font-family:'Geist',sans-serif;color:#14150F;border-bottom:0\">Move and edit tickets<\u002Fsc-raw-th><sc-raw-td><span class=\"chip y\">Yes<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"chip y\">Yes<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"chip n\">No<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-th scope=\"row\" style=\"font-weight:500;font-size:15px;text-transform:none;letter-spacing:0;font-family:'Geist',sans-serif;color:#14150F;border-bottom:0\">Report bugs and requests<\u002Fsc-raw-th><sc-raw-td><span class=\"chip y\">Yes<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"chip y\">Yes<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"chip y\">Yes<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-th scope=\"row\" style=\"font-weight:500;font-size:15px;text-transform:none;letter-spacing:0;font-family:'Geist',sans-serif;color:#14150F;border-bottom:0\">Assign tickets<\u002Fsc-raw-th><sc-raw-td><span class=\"chip y\">Yes<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"chip n\">No<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"chip n\">No<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n          <sc-raw-tr><sc-raw-th scope=\"row\" style=\"font-weight:500;font-size:15px;text-transform:none;letter-spacing:0;font-family:'Geist',sans-serif;color:#14150F;border-bottom:0\">Invite or remove people<\u002Fsc-raw-th><sc-raw-td><span class=\"chip y\">Yes<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"chip n\">No<\u002Fspan><\u002Fsc-raw-td><sc-raw-td><span class=\"chip n\">No<\u002Fspan><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n        <\u002Fsc-raw-tbody>\n      <\u002Fsc-raw-table>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- JOIN -->\n  <section id=\"join\" class=\"wrap\" style=\"padding-bottom:clamp(48px,7vw,96px)\">\n    <div class=\"rv\" style=\"background:#2F3BFF;color:#fff;border-radius:clamp(22px,3vw,32px);padding:clamp(32px,6vw,76px)\">\n      <h2 class=\"disp\" style=\"margin:0;font-size:clamp(32px,5.4vw,68px);line-height:1;font-weight:700;max-width:13em\">Your next project deserves a board that knows who's on it.<\u002Fh2>\n      <p style=\"margin:20px 0 0;font-size:18px;line-height:1.5;color:#DCDFFF;max-width:480px\">Join the early list and be first in when the doors open.<\u002Fp>\n      <sc-if value=\"{{notJoined}}\" hint-placeholder-val=\"{{true}}\">\n        <form sc-camel-on-submit=\"{{onJoin}}\" style=\"margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;max-width:560px\">\n          <label for=\"email\" class=\"sr\">Email address<\u002Flabel>\n          <input id=\"email\" class=\"em\" type=\"email\" required=\"\" placeholder=\"you@yourstudio.com\">\n          <button class=\"btn btn-ink\" type=\"submit\" style=\"min-height:54px\">Get early access<\u002Fbutton>\n        <\u002Fform>\n      <\u002Fsc-if>\n      <sc-if value=\"{{joined}}\" hint-placeholder-val=\"{{false}}\">\n        <div class=\"pop\" style=\"margin-top:30px;font-size:20px;font-weight:600\">You're on the list. We'll be in touch.<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- FOOTER -->\n  <footer class=\"wrap\" style=\"padding-top:8px;padding-bottom:36px\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:24px;border-top:1px solid #DCDCD2\">\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 30 30\" aria-hidden=\"true\"><rect width=\"30\" height=\"30\" rx=\"8\" fill=\"#14150F\"><\u002Frect><rect x=\"7\" y=\"8\" width=\"7\" height=\"14\" rx=\"2\" fill=\"#F4F4F0\"><\u002Frect><rect x=\"16\" y=\"8\" width=\"7\" height=\"8\" rx=\"2\" fill=\"#8E96FF\"><\u002Frect><\u002Fsvg>\n        <span class=\"disp\" style=\"font-weight:700;font-size:18px\">Solorise<\u002Fspan>\n        <span class=\"mono\" style=\"font-size:12px;color:#6A6D62;margin-left:8px\">© 2026<\u002Fspan>\n      <\u002Fdiv>\n      <nav aria-label=\"Footer\" style=\"display:flex;flex-wrap:wrap;gap:4px\">\n        <a class=\"nl\" href=\"#board\">Board<\u002Fa>\n        <a class=\"nl\" href=\"#ai\">AI triage<\u002Fa>\n        <a class=\"nl\" href=\"#access\">Access<\u002Fa>\n        <a class=\"nl\" href=\"#join\">Contact<\u002Fa>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;autoplay&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true},&quot;$preview&quot;:{&quot;width&quot;:1360,&quot;height&quot;:5200}}\">\nclass Component extends DCLogic {\n  state = {\n    role: 'owner',\n    project: 'harbor',\n    filter: 'all',\n    tickets: this.seed(),\n    seq: { harbor: 23, nomad: 34, kiln: 13 },\n    reports: 0,\n    dragId: null,\n    overCol: null,\n    swapN: 0,\n    toast: null,\n    toastN: 0,\n    touched: false,\n    aiText: '',\n    aiPhase: 0,\n    result: null,\n    created: false,\n    joined: false\n  };\n\n  seed() {\n    const T = (id, project, title, type, dept, who, col, client, pri, cm, due, via) => ({ id, project, title, type, dept, who, col, client, pri, cm, due, via: via || '', ani: 'ent' });\n    return [\n      T('HB-21', 'harbor', 'Checkout button wraps on small phones', 'bug', 'Frontend', 'MR', 0, true, 3, 2, 'Today', 'Lena'),\n      T('HB-20', 'harbor', 'Footer links should open in a new tab', 'change', 'Frontend', 'MR', 0, true, 1, 0, '', 'Lena'),\n      T('HB-19', 'harbor', 'Rotate API keys before launch', 'feature', 'Backend', 'TB', 0, false, 2, 1, 'Mon'),\n      T('HB-18', 'harbor', 'Newsletter signup form', 'feature', 'Frontend', 'MR', 1, true, 2, 3, 'Fri'),\n      T('HB-17', 'harbor', 'Swap team photos on About page', 'change', 'Design', 'IK', 1, true, 1, 4, 'Wed', 'Lena'),\n      T('HB-15', 'harbor', 'Contact form email not sending', 'bug', 'Backend', 'TB', 2, true, 3, 5, 'Today', 'Lena'),\n      T('HB-12', 'harbor', 'Homepage hero animation', 'feature', 'Frontend', 'MR', 2, false, 2, 2, 'Thu'),\n      T('HB-09', 'harbor', 'New logo lockup in header', 'change', 'Design', 'IK', 3, true, 1, 6, ''),\n      T('HB-07', 'harbor', 'Set up staging deploys', 'feature', 'Backend', 'TB', 3, false, 2, 0, ''),\n      T('NF-30', 'nomad', 'Onboarding: cut it to three screens', 'change', 'Design', 'IK', 0, true, 2, 1, 'Tue'),\n      T('NF-33', 'nomad', 'Workout timer stops in background', 'bug', 'Frontend', 'YO', 1, true, 3, 4, 'Today'),\n      T('NF-31', 'nomad', 'Sync workouts with Apple Health', 'feature', 'Backend', 'TB', 1, true, 2, 2, 'Fri'),\n      T('NF-28', 'nomad', 'Crash when signing in with Google', 'bug', 'Backend', 'TB', 2, true, 3, 3, 'Today'),\n      T('NF-26', 'nomad', 'Streak badges', 'feature', 'Design', 'IK', 3, true, 1, 0, ''),\n      T('NF-25', 'nomad', 'App Store screenshots', 'change', 'Content', 'IK', 3, false, 1, 1, ''),\n      T('KC-11', 'kiln', 'Apple Pay at checkout', 'feature', 'Backend', 'TB', 0, true, 2, 0, 'Mon'),\n      T('KC-12', 'kiln', \"Variant swatches don't update the price\", 'bug', 'Frontend', 'MR', 1, true, 3, 2, 'Thu'),\n      T('KC-10', 'kiln', 'Rewrite the shipping policy page', 'change', 'Content', 'IK', 2, true, 1, 3, 'Wed'),\n      T('KC-07', 'kiln', 'Redirect old product URLs', 'feature', 'Backend', 'TB', 2, false, 1, 1, ''),\n      T('KC-09', 'kiln', 'Product page photo grid', 'feature', 'Design', 'IK', 3, true, 2, 5, ''),\n      T('KC-08', 'kiln', 'Cart drawer on mobile', 'feature', 'Frontend', 'MR', 3, true, 2, 2, '')\n    ];\n  }\n\n  projects() {\n    return [\n      { id: 'harbor', name: 'Harbor Studio', sub: 'Brand site rebuild', slug: 'harbor-studio', code: 'HB', dot: 'pd-a', members: ['YO', 'MR', 'TB', 'IK', 'LE'], team: true, client: true },\n      { id: 'nomad', name: 'Nomad Fit', sub: 'iOS app v2', slug: 'nomad-fit', code: 'NF', dot: 'pd-b', members: ['YO', 'TB', 'IK'], team: false, client: false },\n      { id: 'kiln', name: 'Kiln & Co', sub: 'Shopify store', slug: 'kiln-and-co', code: 'KC', dot: 'pd-c', members: ['YO', 'MR', 'TB', 'IK'], team: true, client: false }\n    ];\n  }\n\n  people() {\n    return {\n      YO: { name: 'You', role: 'Owner', depts: [] },\n      MR: { name: 'Maya R.', role: 'Frontend contractor', depts: ['Frontend'] },\n      TB: { name: 'Tomas B.', role: 'Backend contractor', depts: ['Backend'] },\n      IK: { name: 'Ines K.', role: 'Design & content', depts: ['Design', 'Content'] },\n      LE: { name: 'Lena', role: 'Client', depts: [] }\n    };\n  }\n\n  colNames() { return ['Inbox', 'In progress', 'In review', 'Shipped']; }\n\n  samples() {\n    return [\n      { label: 'Checkout bug', text: \"The checkout button overlaps the footer on iPhone SE, and the client can't pay\" },\n      { label: 'Apple Pay', text: 'Add Apple Pay at checkout for the Kiln & Co store' },\n      { label: 'Swap hero photo', text: 'Swap the hero photo for the new campaign shot the client sent' }\n    ];\n  }\n\n  /* ---------- board behaviour ---------- */\n  touch = () => {\n    this.touched = true;\n    clearTimeout(this.ambT);\n    if (!this.state.touched) this.setState({ touched: true });\n  };\n\n  patch = (id, f) => this.state.tickets.map((t) => (t.id === id ? Object.assign({}, t, f) : t));\n\n  emit = (tickets, ini, text) => {\n    clearTimeout(this.toastT);\n    this.setState({ tickets: tickets, toast: { ini: ini, text: text }, toastN: this.state.toastN + 1 });\n    this.toastT = setTimeout(() => this.setState({ toast: null }), 2600);\n  };\n\n  moveTo = (id, col) => {\n    const t = this.state.tickets.find((x) => x.id === id);\n    if (!t || t.col === col) return;\n    this.emit(this.patch(id, { col: col, ani: 'land' }), 'YO', 'You moved ' + id + ' to ' + this.colNames()[col]);\n  };\n\n  moveTicket = (id) => {\n    if (this.state.role === 'client') return;\n    this.touch();\n    const t = this.state.tickets.find((x) => x.id === id);\n    if (t) this.moveTo(id, (t.col + 1) % 4);\n  };\n\n  dragStart = (e, id) => {\n    if (this.state.role === 'client') { if (e.preventDefault) e.preventDefault(); return; }\n    this.touch();\n    if (e.dataTransfer) {\n      try { e.dataTransfer.setData('text/plain', id); e.dataTransfer.effectAllowed = 'move'; } catch (err) { /* ignore */ }\n    }\n    setTimeout(() => this.setState({ dragId: id }), 0);\n  };\n\n  dragOver = (e, ci) => {\n    if (this.state.role === 'client') return;\n    if (e.preventDefault) e.preventDefault();\n    if (this.state.overCol !== ci) this.setState({ overCol: ci });\n  };\n\n  dropOn = (e, ci) => {\n    if (e.preventDefault) e.preventDefault();\n    let id = this.state.dragId;\n    if (!id && e.dataTransfer) id = e.dataTransfer.getData('text/plain');\n    this.setState({ dragId: null, overCol: null });\n    if (id) this.moveTo(id, ci);\n  };\n\n  onDragEnd = () => { this.setState({ dragId: null, overCol: null }); };\n\n  reportBug = () => {\n    this.touch();\n    const titles = ['Menu overlaps the logo on iPad', 'Typo in the footer address', 'Cookie banner hides the contact button'];\n    const k = this.state.reports;\n    const seq = Object.assign({}, this.state.seq);\n    const n = seq.harbor;\n    seq.harbor = n + 1;\n    const ticket = { id: 'HB-' + n, project: 'harbor', title: titles[k % titles.length], type: 'bug', dept: 'Frontend', who: '', col: 0, client: true, pri: 2, cm: 0, due: '', via: 'Lena', ani: 'fresh' };\n    this.setState({ seq: seq, reports: k + 1 });\n    this.emit(this.state.tickets.concat([ticket]), 'LE', 'Lena reported HB-' + n);\n  };\n\n  /* ambient \"live team\" loop */\n  ambSteps = () => [\n    () => this.emit(this.state.tickets.concat([{ id: 'HB-22', project: 'harbor', title: 'Menu overlaps the logo on iPad', type: 'bug', dept: 'Frontend', who: '', col: 0, client: true, pri: 2, cm: 0, due: '', via: 'Lena', ani: 'fresh' }]), 'LE', 'Lena reported a bug'),\n    () => this.emit(this.patch('HB-22', { who: 'MR' }), 'MR', 'AI assigned HB-22 to Maya · Frontend'),\n    () => this.emit(this.patch('HB-18', { col: 2, ani: 'land' }), 'MR', 'Maya moved HB-18 to In review'),\n    () => this.emit(this.patch('HB-22', { col: 1, ani: 'land' }), 'MR', 'Maya started on HB-22'),\n    () => this.emit(this.patch('HB-12', { col: 3, ani: 'land' }), 'MR', 'Maya shipped HB-12'),\n    () => this.emit(this.patch('HB-15', { col: 3, ani: 'land' }), 'TB', 'Tomas shipped the contact form fix')\n  ];\n\n  ambStep = (i) => {\n    if (this.touched) return;\n    const steps = this.ambSteps();\n    if (i >= steps.length) {\n      this.ambT = setTimeout(() => {\n        if (this.touched) return;\n        this.setState({ tickets: this.seed(), toast: null, swapN: this.state.swapN + 1 });\n        this.ambT = setTimeout(() => this.ambStep(0), 1500);\n      }, 4200);\n      return;\n    }\n    steps[i]();\n    this.ambT = setTimeout(() => this.ambStep(i + 1), 2800);\n  };\n\n  /* ---------- AI triage ---------- */\n  classify = (text) => {\n    const t = text.toLowerCase();\n    const has = (...w) => w.some((x) => t.includes(x));\n    let type = 'feature';\n    if (has('bug', 'broken', 'crash', 'error', \"can't\", 'cannot', 'overlap', 'not working', 'fails', 'misaligned', 'wrong', 'glitch')) type = 'bug';\n    else if (has('swap', 'change', 'replace', 'update', 'rename', 'tweak', 'instead', 'different')) type = 'change';\n\n    let dept = 'Frontend';\n    if (has('button', 'layout', 'mobile', 'iphone', 'android', 'css', 'responsive', 'scroll', 'menu', 'overlap', 'page')) dept = 'Frontend';\n    else if (has('logo', 'photo', 'colour', 'color', 'font', 'brand', 'hero', 'image', 'icon', 'illustration', 'banner')) dept = 'Design';\n    else if (has('copy', 'wording', 'blog', 'headline', 'typo', 'text', 'caption')) dept = 'Content';\n    else if (has('api', 'payment', 'apple pay', 'stripe', 'login', 'database', 'server', 'webhook', 'email', 'sync', 'auth', 'checkout')) dept = 'Backend';\n\n    let pid = 'harbor';\n    if (has('kiln', 'shopify', 'store', 'cart')) pid = 'kiln';\n    else if (has('nomad', 'workout', 'ios app', 'fitness')) pid = 'nomad';\n\n    let priority = type === 'change' ? 'Low' : 'Medium';\n    if (has('urgent', 'asap', 'crash', 'blocked', \"can't pay\", 'cannot pay', \"can't log\")) priority = 'High';\n\n    const proj = this.projects().find((p) => p.id === pid);\n    const people = this.people();\n    const openOf = (ini) => this.state.tickets.filter((x) => x.project === pid && x.who === ini && x.col < 3).length;\n    const pool = proj.members.filter((i) => i !== 'LE' && i !== 'YO' && people[i].depts.includes(dept));\n    let who = 'YO';\n    if (pool.length) who = pool.reduce((a, b) => (openOf(b) < openOf(a) ? b : a));\n    const reason = who === 'YO'\n      ? 'Nobody else covers ' + dept + ' here'\n      : 'Covers ' + dept + ' · ' + openOf(who) + ' open on this board';\n    const labels = { bug: 'Bug', feature: 'Feature', change: 'Change request' };\n    return {\n      type: type,\n      typeLabel: labels[type],\n      tagCls: 'tag tag-' + type,\n      dept: dept,\n      projectId: pid,\n      projectName: proj.name,\n      whoIni: who,\n      whoName: people[who].name,\n      avCls: 'av av32 av-' + who,\n      reason: reason,\n      priority: priority,\n      prioCls: 'prio ' + (priority === 'High' ? 'prio-h' : priority === 'Low' ? 'prio-l' : 'prio-m')\n    };\n  };\n\n  clearAi = () => {\n    clearInterval(this.typeT);\n    clearTimeout(this.thinkT);\n    clearTimeout(this.nextT);\n    clearTimeout(this.startT);\n  };\n\n  runTriage = (text) => {\n    clearTimeout(this.thinkT);\n    const t = (text || '').trim();\n    if (!t) { this.setState({ aiPhase: 0, result: null, created: false }); return; }\n    this.setState({ aiPhase: 2, result: null, created: false });\n    this.thinkT = setTimeout(() => this.setState({ aiPhase: 3, result: this.classify(t) }), 900);\n  };\n\n  runSample = (i, manual) => {\n    this.clearAi();\n    if (manual) this.userDriven = true;\n    const text = this.samples()[i].text;\n    let n = 0;\n    this.setState({ aiText: '', aiPhase: 0, result: null, created: false });\n    this.typeT = setInterval(() => {\n      n += 3;\n      if (n >= text.length) {\n        clearInterval(this.typeT);\n        this.setState({ aiText: text });\n        this.runTriage(text);\n        if (!this.userDriven && this.props.autoplay !== false) {\n          this.nextT = setTimeout(() => this.runSample((i + 1) % 3, false), 7500);\n        }\n      } else {\n        this.setState({ aiText: text.slice(0, n) });\n      }\n    }, 45);\n  };\n\n  onText = (e) => {\n    this.userDriven = true;\n    this.clearAi();\n    this.setState({ aiText: e.target.value, aiPhase: 0, result: null, created: false });\n  };\n\n  onFocus = () => { this.userDriven = true; this.clearAi(); };\n\n  onTriage = () => {\n    this.userDriven = true;\n    this.clearAi();\n    this.runTriage(this.state.aiText);\n  };\n\n  createTicket = () => {\n    const r = this.state.result;\n    if (!r || this.state.created) return;\n    this.touch();\n    const proj = this.projects().find((p) => p.id === r.projectId);\n    const seq = Object.assign({}, this.state.seq);\n    const n = seq[proj.id];\n    seq[proj.id] = n + 1;\n    let title = this.state.aiText.trim();\n    if (title.length > 70) title = title.slice(0, 67) + '...';\n    const pri = r.priority === 'High' ? 3 : r.priority === 'Low' ? 1 : 2;\n    const ticket = { id: proj.code + '-' + n, project: proj.id, title: title, type: r.type, dept: r.dept, who: r.whoIni, col: 0, client: false, pri: pri, cm: 0, due: '', via: '', ani: 'fresh' };\n    this.setState({ seq: seq, created: true, role: 'owner', project: proj.id, filter: 'all', swapN: this.state.swapN + 1 });\n    this.emit(this.state.tickets.concat([ticket]), r.whoIni, 'AI filed ' + proj.code + '-' + n + ' to ' + r.whoName);\n  };\n\n  onJoin = (e) => {\n    if (e && e.preventDefault) e.preventDefault();\n    this.setState({ joined: true });\n  };\n\n  componentDidMount() {\n    if (this.props.autoplay !== false) {\n      this.startT = setTimeout(() => this.runSample(0, false), 1800);\n      this.ambT = setTimeout(() => this.ambStep(0), 3600);\n    } else {\n      this.touched = true;\n    }\n  }\n\n  componentWillUnmount() {\n    this.clearAi();\n    clearTimeout(this.ambT);\n    clearTimeout(this.toastT);\n  }\n\n  renderVals() {\n    const s = this.state;\n    const role = s.role;\n    const projects = this.projects();\n    const people = this.people();\n    const cur = projects.find((p) => p.id === s.project);\n    const canOpen = (p) => role === 'owner' || (role === 'team' ? p.team : p.client);\n    const locked = !canOpen(cur);\n    const bump = () => s.swapN + 1;\n\n    const roleDefs = [\n      { id: 'owner', label: 'You · Owner' },\n      { id: 'team', label: 'Maya · Contractor' },\n      { id: 'client', label: 'Lena · Client' }\n    ];\n    const roles = roleDefs.map((r) => ({\n      label: r.label,\n      cls: r.id === role ? 'seg on' : 'seg',\n      pressed: r.id === role,\n      pick: () => { this.touch(); this.setState({ role: r.id, swapN: bump() }); }\n    }));\n\n    const projList = projects.map((p) => {\n      const all = s.tickets.filter((t) => t.project === p.id);\n      const done = all.filter((t) => t.col === 3).length;\n      return {\n        name: p.name,\n        sub: p.sub,\n        cls: p.id === s.project ? 'proj on' : 'proj',\n        dotCls: 'pdot ' + p.dot,\n        locked: !canOpen(p),\n        pct: all.length ? Math.round((done / all.length) * 100) : 0,\n        pick: () => { this.touch(); this.setState({ project: p.id, swapN: bump() }); }\n      };\n    });\n\n    const members = cur.members.map((i) => ({\n      ini: i,\n      name: people[i].name,\n      role: people[i].role,\n      avCls: 'av av32 av-' + i\n    }));\n\n    const visAll = s.tickets.filter((t) => t.project === cur.id && (role === 'owner' || (role === 'team' ? t.dept === 'Frontend' : t.client)));\n    const vis = visAll.filter((t) => s.filter === 'all' || t.type === s.filter);\n    const doneCount = visAll.filter((t) => t.col === 3).length;\n    const pct = visAll.length ? Math.round((doneCount / visAll.length) * 100) : 0;\n\n    const filterDefs = [\n      { id: 'all', label: 'All' },\n      { id: 'bug', label: 'Bugs' },\n      { id: 'feature', label: 'Features' },\n      { id: 'change', label: 'Changes' }\n    ];\n    const filters = filterDefs.map((f) => ({\n      label: f.label,\n      count: f.id === 'all' ? visAll.length : visAll.filter((t) => t.type === f.id).length,\n      cls: f.id === s.filter ? 'fchip on' : 'fchip',\n      pressed: f.id === s.filter,\n      pick: () => { this.touch(); this.setState({ filter: f.id, swapN: bump() }); }\n    }));\n\n    const typeLabel = { bug: 'Bug', feature: 'Feature', change: 'Change request' };\n    const priLabel = ['', 'Low', 'Medium', 'High'];\n    const cols = this.colNames().map((name, ci) => {\n      const items = vis.filter((t) => t.col === ci).map((t) => ({\n        id: t.id,\n        title: t.title,\n        typeLabel: typeLabel[t.type],\n        isBug: t.type === 'bug',\n        isFeat: t.type === 'feature',\n        isChg: t.type === 'change',\n        tiCls: 'ti ti-' + t.type,\n        cls: 'tk a-' + (t.ani || 'ent') + (s.dragId === t.id ? ' drag' : ''),\n        dept: t.dept,\n        ini: t.who || '?',\n        avCls: 'av av-' + (t.who || 'none'),\n        via: t.via,\n        hasVia: !!t.via,\n        cm: t.cm,\n        hasCm: t.cm > 0,\n        due: t.due,\n        hasDue: !!t.due && t.col < 3,\n        priCls: 'pri p' + t.pri,\n        priLabel: priLabel[t.pri],\n        canMove: role !== 'client',\n        canDrag: role === 'client' ? 'false' : 'true',\n        move: () => this.moveTicket(t.id),\n        dragStart: (e) => this.dragStart(e, t.id)\n      }));\n      return {\n        name: name,\n        count: items.length,\n        items: items,\n        empty: items.length === 0,\n        cls: s.overCol === ci ? 'col over' : 'col',\n        dotCls: 'si si' + ci,\n        over: (e) => this.dragOver(e, ci),\n        drop: (e) => this.dropOn(e, ci)\n      };\n    });\n\n    const notes = {\n      owner: 'Owner view: every ticket on every project, full control. Drag a card, or use the arrow on it.',\n      team: \"Contractor view: Maya only sees Frontend tickets, and only on projects you've added her to.\",\n      client: \"Client view: Lena sees what you share with her, read-only. She can report bugs but can't move anything.\"\n    };\n\n    const samples = this.samples().map((x, i) => ({ label: x.label, pick: () => this.runSample(i, true) }));\n    const res = s.result || { tagCls: 'tag', typeLabel: '', dept: '', projectName: '', whoIni: '', whoName: '', avCls: 'av av32', reason: '', priority: '', prioCls: 'prio' };\n    const toast = s.toast || { ini: 'YO', text: '' };\n\n    return {\n      slug: cur.slug,\n      liveLabel: s.touched ? 'Your sandbox' : 'Live demo',\n      roles: roles,\n      projList: projList,\n      members: members,\n      title: cur.name,\n      sub: cur.sub,\n      pct: pct,\n      filters: filters,\n      hint: role === 'client' ? 'Read-only view' : 'Drag cards between columns',\n      roleNote: notes[role],\n      showReport: role === 'client' && !locked,\n      reportBug: this.reportBug,\n      locked: locked,\n      open: !locked,\n      lockTitle: (role === 'team' ? \"Maya isn't on \" : \"Lena isn't on \") + cur.name,\n      lockBody: role === 'team' ? 'Contractors only see the projects you add them to.' : 'Each client only ever sees their own project.',\n      swapCls: 'sw' + (s.swapN % 2),\n      cols: cols,\n      onDragEnd: this.onDragEnd,\n      hasToast: !!s.toast,\n      toastCls: 'toast t' + (s.toastN % 2),\n      toastAv: 'av av-' + toast.ini,\n      toastIni: toast.ini,\n      toastText: toast.text,\n      aiText: s.aiText,\n      onText: this.onText,\n      onFocus: this.onFocus,\n      onTriage: this.onTriage,\n      samples: samples,\n      idle: s.aiPhase === 0,\n      thinking: s.aiPhase === 2,\n      done: s.aiPhase === 3,\n      res: res,\n      created: s.created,\n      notCreated: !s.created,\n      createTicket: this.createTicket,\n      joined: s.joined,\n      notJoined: !s.joined,\n      onJoin: this.onJoin\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
